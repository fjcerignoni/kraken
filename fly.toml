app = "kraken-shadow-spirits"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  HEALTH_PORT = "8080"
  LOG_FORMAT = "json"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "45s"
  method = "get"
  path = "/health"
